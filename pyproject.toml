[project]
name = "fpl-assistant"
version = "0.0.1"
description = "FPL decision engine: stats-only prediction engine, backtested and validated."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "xgboost>=2.1",
    "sqlalchemy>=2.0",
    "pyarrow>=17.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pulp>=3.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
]
notebooks = [
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "features", "market_overlay", "backtest", "api", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
